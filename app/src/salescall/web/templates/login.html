<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン — SalesCall</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="content login-page">
<div class="card">
  <h1 class="login-brand">Sales<b>Call</b></h1>
  {# ログインの確かめは core の people の1か所。通らなかった理由は出さない（ログインIDが在るかを教えない） #}
  {% if error %}<div class="flash ng" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <label class="field" for="login-id">ログインID</label>
    <input id="login-id" type="text" name="login_id" autocomplete="username" required autofocus>
    <label class="field" for="login-password">パスワード</label>
    <input id="login-password" type="password" name="password" autocomplete="current-password" required>
    <button class="btn main" type="submit">ログイン</button>
  </form>
  <p class="hint">{{ note }}</p>
</div>
</main></body></html>
