{#- 狭い幅では長い名前を隠し、短い名前（停止・承認）を残す（数字だけにしない＝どちらの数か分かるように） -#}
{%- if n_stops %}<a class="pill stop" href="/t/stops" aria-label="止まっているもの {{ n_stops }} 件"><span class="dot"></span><span class="long">止まっている </span><span class="short">停止 </span>{{ n_stops }}</a>{% endif -%}
{%- if n_wait %}<a class="pill wait" href="/t/inbox" aria-label="承認待ち {{ n_wait }} 件"><span class="dot"></span><span class="long">承認待ち </span><span class="short">承認 </span>{{ n_wait }}</a>{% endif -%}
