{#- どの幅でも同じ呼び方（2026-11-21 の見直し：狭い幅だけ「停止」と書き、「緊急停止」のボタンと紛らわしかった。画面の名前「止まっているもの」とそろえる） -#}
{%- if n_stops %}<a class="pill stop" href="/t/stops" aria-label="{{ words.page('stops') }} {{ n_stops }} 件"><span class="dot"></span>止まっている {{ n_stops }}</a>{% endif -%}
{%- if n_wait %}<a class="pill wait" href="/t/inbox" aria-label="{{ words.page('inbox') }} {{ n_wait }} 件"><span class="dot"></span>承認待ち {{ n_wait }}</a>{% endif -%}
{#- 依頼者のタブの印の材料（帯と同じ数え方の内訳。印を付けるのは app.js の1か所＝タブの data-client） -#}
<span hidden data-tab-marks data-stop="{{ stop_clients|join(' ') }}" data-wait="{{ wait_clients|join(' ') }}"></span>
